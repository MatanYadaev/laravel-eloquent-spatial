name: Tests

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    test:
        name: Pest - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - DB ${{ matrix.db }} ${{ matrix.dependency-version }}

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.5, 8.4, 8.3, 8.2 ]
                laravel: [ 13.*, 12.* ]
                db: [ 'mysql:8.4', 'mariadb:10.11.16', 'postgis/postgis:18-3.6', 'postgis/postgis:17-3.5', 'postgis/postgis:16-3.4', 'postgis/postgis:15-3.4', 'postgis/postgis:14-3.4' ]
                dependency-version: [ prefer-stable ]
                include:
                    -   laravel: 12.*
                        testbench: ^10.0
                    -   laravel: 13.*
                        testbench: ^11.0
                exclude:
                    -   laravel: 13.*
                        php: 8.2

        services:
            db:
                image: ${{ matrix.db }}
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: laravel_eloquent_spatial_test
                    POSTGRES_DB: laravel_eloquent_spatial_test
                    POSTGRES_USER: root
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - ${{ contains(matrix.db, 'postgis') && '5432' || '3306' }}
                options: >-
                    ${{ (contains(matrix.db, 'postgis') && '--health-cmd="pg_isready"') || '--health-cmd="mysqladmin ping"' }}
                    --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            -   name: Checkout code
                uses: actions/checkout@v2

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

            -   name: Set DB_CONNECTION env variable (PostGIS)
                if: contains(matrix.db, 'postgis')
                run: |
                    echo "DB_CONNECTION=pgsql" >> "$GITHUB_ENV"

            -   name: Execute tests
                env:
                    DB_PORT: ${{ job.services.db.ports[contains(matrix.db, 'postgis') && '5432' || '3306'] }}
                    DB_CONNECTION: ${{ env.DB_CONNECTION || 'mysql' }}
                run: vendor/bin/pest --no-coverage
